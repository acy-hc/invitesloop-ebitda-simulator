<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>병원정보 설정 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="shared.js"></script>
<script src="engine.js"></script>
<script src="kpi-engine.js"></script>
<script src="perf-data.js"></script>
<script src="hospital-basic.js"></script>
<script src="kpi-setting.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<script>
const page = mountShell({
  active: 'hospital-setting', title: '병원정보 설정',
  footer: `시안 — 이 화면에서 저장한 값은 이 브라우저에 저장됩니다. 병원 기초정보는 병원 EBITDA 시뮬레이터 계산에, 성과 설정은 병원경영 Dashboard 계산에 바로 쓰입니다. 입원 실적·성과 데이터는 ${loadHospitals().find(h => h.id === currentHospitalId()).name} 예시값입니다.`,
});

/* 위: 병원 기초정보, 아래: 성과 설정 */
const sectionHead = (icon, title, desc) => `<div class="flex items-start gap-3"><span class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary"><i data-lucide="${icon}" class="size-5"></i></span><div class="space-y-0.5"><h2 class="text-lg font-semibold tracking-tight">${title}</h2><p class="text-sm text-muted-foreground">${desc}</p></div></div>`;
page.innerHTML = `
  <section id="basic" class="scroll-mt-20 space-y-4">
    ${sectionHead('hospital', '병원 기초정보', '병원 EBITDA 시뮬레이터가 쓰는 병원 정보·매출 항목·재무 상수·프리셋입니다.')}
    <div id="basicRoot" class="space-y-6"></div>
  </section>
  <section id="perf" class="scroll-mt-20 space-y-4 border-t pt-8">
    ${sectionHead('settings-2', '성과 설정', '병원경영 Dashboard가 쓰는 KPI·기준·목표·데이터 항목과 데이터 입력입니다.')}
    <div id="perfRoot"></div>
  </section>`;

mountHospitalBasic(document.getElementById('basicRoot'));
mountKpiSetting(document.getElementById('perfRoot'));
if (location.hash.startsWith('#perf-')) document.getElementById('perf').scrollIntoView();
</script>
</body>
</html>
