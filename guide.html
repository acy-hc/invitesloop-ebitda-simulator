<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사용 가이드 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<script>
const page = mountShell({ active: 'guide', title: '사용 가이드', footer: '시안 — 화면의 물음표 아이콘에 마우스를 올리면 이 가이드의 설명을 그 자리에서 볼 수 있습니다.' });
const H = loadHospitals()[0];

const TOC = [
  ['overview', '이 화면으로 하는 일'],
  ['start', '처음 쓰는 순서'],
  ['simulator', '시뮬레이터'],
  ['hospital', '병원 기초정보'],
  ['fields', '입력 항목 설명'],
  ['glossary', '용어집'],
  ['faq', '자주 묻는 질문'],
];

const sec = (id, title, desc, body) => `<section id="${id}" class="card scroll-mt-24"><div class="card-header"><h2 class="card-title text-lg">${title}</h2>${desc ? `<p class="card-desc">${desc}</p>` : ''}</div><div class="card-content space-y-4">${body}</div></section>`;
const link = (href, text) => `<a href="${href}" class="text-primary underline-offset-4 hover:underline">${text}</a>`;

/* 처음 쓰는 순서 */
const STEPS = [
  ['병원 실적 확인', `병원 기초정보 > 기본정보·실적에서 외래·입원·건강검진 인원과 <b>집계 기간</b>을 확인합니다. 12개월이 안 되는 실적은 연환산되어 쓰입니다.`, 'hospital.html#info'],
  ['매출 항목 정하기', '병원 기초정보 > 매출 항목에서 쓸 항목을 켜고, 필요한 항목을 추가합니다. 산출 방식에 따라 시뮬레이터 입력 칸이 정해집니다.', 'hospital.html#items'],
  ['재무 상수 확인', '인건비·세율·감가상각·WACC 같은 공통 값을 확인합니다. 바꾸면 모든 시나리오 결과가 함께 달라집니다.', 'hospital.html#profile'],
  ['프리셋 준비', '시나리오 프리셋 탭에서 시작 값 묶음을 확인하고, 필요하면 프리셋을 추가합니다. 하한·상한 프리셋이 EBITDA 밴드를 정합니다.', 'hospital.html#presets'],
  ['시나리오 만들기', '시뮬레이터에서 <b>새 시나리오</b>를 눌러 이름과 설명을 쓰고 시작 프리셋을 고릅니다.', 'simulator.html'],
  ['입력 조정·결과 확인', '왼쪽 입력판의 값을 바꾸고 오른쪽 그래프와 표로 5년 변화를 봅니다. 그래프나 표의 연도를 누르면 그 연도가 선택됩니다.', 'simulator.html'],
  ['저장·비교', '상단 저장 버튼으로 저장합니다(버전이 1 올라갑니다). 하단 시나리오 비교 탭에서 다른 시나리오와 나란히 봅니다.', 'simulator.html'],
];
const steps = `<ol class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${STEPS.map(([t, d, href], i) => `<li class="flex gap-3 rounded-lg border p-4">
  <span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-primary text-sm font-semibold text-primary-foreground">${i + 1}</span>
  <div class="space-y-1.5"><div class="font-medium">${t}</div><p class="text-sm text-muted-foreground">${d}</p>${link(href, '바로 가기 →')}</div></li>`).join('')}</ol>`;

/* 시뮬레이터 화면 구성 — 영역 번호와 설명 */
const SIM_AREAS = [
  ['시나리오 줄', '시나리오 선택, 새 시나리오·복제·삭제, 저장. 값을 바꾸면 "수정됨"이 붙고 저장 버튼이 켜집니다.'],
  ['프리셋·실적 기간', '이 시나리오의 프리셋과, 계산에 쓰는 병원 실적의 집계 기간. 프리셋을 바꾸거나 프리셋 값으로 되돌릴 수 있습니다.'],
  ['입력판', '환자 기반 → 매출 항목 → 비용 → 구독자 누적 → 기타 순서. 매출 항목은 병원 기초정보에서 켠 항목만 나옵니다.'],
  ['핵심 지표', '선택 연도의 매출·EBITDA·세후이익·활성 구독자와 5년 추이선, EBITDA 밴드.'],
  ['추이 그래프 + 표', '5년 손익, 매출 항목별, 비용 항목별 추이. 그래프 바로 아래 표에 같은 숫자와 Y1→Y5 연평균 증가율이 있습니다.'],
  ['EBITDA 구성·기업가치', '선택 연도의 EBITDA가 만들어지는 과정, EV와 민감도 표. 아래에 상세 손익표와 가정·가드레일이 접혀 있습니다.'],
  ['하단 탭', '시나리오 비교(최대 3개)와 수식 확인·수정.'],
];
const wire = `<div class="grid gap-2 rounded-lg border bg-muted/40 p-3 text-xs">
  <div class="flex items-center gap-2 rounded-md border bg-card p-2"><b class="flex size-5 items-center justify-center rounded-full bg-primary text-primary-foreground">1</b>시나리오 · 새 시나리오 · 복제 · 삭제 <span class="ms-auto">저장</span></div>
  <div class="flex items-center gap-2 rounded-md border bg-card p-2"><b class="flex size-5 items-center justify-center rounded-full bg-primary text-primary-foreground">2</b>프리셋 · 실적 기간</div>
  <div class="grid grid-cols-[1fr_2fr] gap-2">
    <div class="flex min-h-40 items-start gap-2 rounded-md border bg-card p-2"><b class="flex size-5 shrink-0 items-center justify-center rounded-full bg-primary text-primary-foreground">3</b>입력판</div>
    <div class="grid gap-2">
      <div class="flex items-center gap-2 rounded-md border bg-card p-2"><b class="flex size-5 items-center justify-center rounded-full bg-primary text-primary-foreground">4</b>핵심 지표</div>
      <div class="flex items-center gap-2 rounded-md border bg-card p-2"><b class="flex size-5 items-center justify-center rounded-full bg-primary text-primary-foreground">5</b>그래프 → 표 (×3)</div>
      <div class="flex items-center gap-2 rounded-md border bg-card p-2"><b class="flex size-5 items-center justify-center rounded-full bg-primary text-primary-foreground">6</b>EBITDA 구성 · EV</div>
    </div>
  </div>
  <div class="flex items-center gap-2 rounded-md border bg-card p-2"><b class="flex size-5 items-center justify-center rounded-full bg-primary text-primary-foreground">7</b>시나리오 비교 · 수식</div>
</div>`;
const simBody = `<div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)]">${wire}
  <ol class="space-y-3">${SIM_AREAS.map(([t, d], i) => `<li class="flex gap-3"><span class="flex size-6 shrink-0 items-center justify-center rounded-full border text-xs font-semibold">${i + 1}</span><div><div class="text-sm font-medium">${t}</div><p class="text-sm text-muted-foreground">${d}</p></div></li>`).join('')}</ol></div>
  <div class="grid gap-3 md:grid-cols-3">
    ${[['mouse-pointer-click', '연도 고르기', '상단 Y1~Y5 탭, 그래프의 연도 영역, 표의 연도 머리글 어느 것을 눌러도 같은 연도가 선택됩니다.'],
      ['triangle-alert', '⚠ 표시', '병원 실적이나 계약으로 확인되지 않은 가정입니다. 가정·가드레일에 모아 보여 줍니다.'],
      ['history', '저장과 버전', '저장할 때마다 버전이 올라갑니다. 저장하지 않고 다른 시나리오로 바꾸면 수정한 값은 사라집니다.']]
      .map(([icon, t, d]) => `<div class="space-y-1.5 rounded-lg bg-muted/60 p-4"><div class="flex items-center gap-2 text-sm font-medium"><i data-lucide="${icon}" class="size-4 text-primary"></i>${t}</div><p class="text-sm text-muted-foreground">${d}</p></div>`).join('')}
  </div>`;

/* 병원 기초정보 탭 */
const HOS_TABS = [
  ['기본정보·실적', '병원 시스템', '병원명·통화·기준연도·운영 거점, 외래·입원·건강검진 실적과 집계 기간. 거점(심천·북경) 실적은 한 병원으로 합산합니다.'],
  ['매출 항목', '이 화면', '매출 항목 추가·편집·순서 변경·사용 여부. 산출 방식(구독형·연계 수수료형·건당형·연도별 직접 입력)이 시뮬레이터 입력 칸을 정합니다.'],
  ['재무 상수', '이 화면', '인건비·인원, 로열티·법인세, 감가상각·CAPEX, WACC·영구성장률·운전자본, 비용 배분 기준. 바꾸면 모든 시나리오 결과가 달라집니다.'],
  ['환자 구분 계수', '이 화면', '외래·입원·건강검진별 만성질환 비율, 위험군 비율, 연계 계수, 환자 증가율.'],
  ['시나리오 프리셋', '이 화면', '프리셋 추가·편집·삭제와 밴드 역할(하한·상한). 프리셋을 삭제해도 그 프리셋으로 만든 시나리오 값은 남습니다.'],
  ['가정', '이 화면', '입력값의 근거, 검증 여부, 적용 시작일. 미검증 가정은 시뮬레이터에 ⚠로 표시됩니다.'],
];
const hosBody = `<div class="overflow-x-auto"><table class="w-full min-w-[640px] text-sm"><thead><tr class="border-b"><th class="th">탭</th><th class="th">관리</th><th class="th">내용</th></tr></thead>
  <tbody>${HOS_TABS.map(([t, who, d]) => `<tr class="border-b last:border-0 align-top"><td class="td font-medium">${t}</td><td class="td">${who === '병원 시스템' ? '<span class="badge badge-secondary"><i data-lucide="lock" class="size-3"></i>병원 시스템 제공</span>' : '<span class="badge badge-outline"><i data-lucide="pencil" class="size-3"></i>이 화면에서 관리</span>'}</td><td class="td whitespace-normal text-muted-foreground">${d}</td></tr>`).join('')}</tbody></table></div>`;

/* 입력 항목 — 병원 데이터에서 만든다 */
const fieldGroups = [
  ...H.revenueItems.filter(i => i.enabled).map(i => [i.name, [...(i.toggle ? [{ key: i.toggle, label: `${i.name} 사용` }] : []), ...i.fields]]),
  ['비용', ['opexRate', 'mktgRate', 'bizdevK', 'omRate'].map(k => ({ key: k, label: { opexRate: '운영비율', mktgRate: '마케팅·CAC·간접비', bizdevK: '초기사업개발비', omRate: '유지보수비' }[k] }))],
  ['구독자 누적 (Reservoir)', [{ key: 'reservoir', label: '구독자 누적 사용' }, { key: 'churn0', label: '기본 이탈률' }, { key: 'rpmAdopt', label: 'RPM 침투율' }, { key: 'rpmDelta', label: 'RPM 이탈감소 효과 δ' }]],
  ['기타', [{ key: 'hcAttr', label: 'CAPEX를 EBITDA 비용에 포함' }]],
];
const fieldsBody = `<div class="overflow-x-auto"><table class="w-full min-w-[640px] text-sm"><thead><tr class="border-b"><th class="th">묶음</th><th class="th">입력</th><th class="th">설명</th></tr></thead><tbody>
  ${fieldGroups.map(([g, fs]) => fs.map((f, i) => `<tr class="border-b align-top">${i === 0 ? `<td class="td font-medium" rowspan="${fs.length}">${esc(g)}</td>` : ''}<td class="td">${f.label}${f.warn ? ' <span class="badge badge-destructive px-1.5 py-0">⚠</span>' : ''}</td><td class="td whitespace-normal text-muted-foreground">${fieldHelp(f)}</td></tr>`).join('')).join('')}
  </tbody></table></div>`;

/* 용어집 — 검색 가능 */
const glossaryBody = `<label class="relative block max-w-sm"><i data-lucide="search" class="pointer-events-none absolute start-3 top-1/2 size-4 -translate-y-1/2 text-muted-foreground"></i><input id="glossarySearch" class="input ps-9" placeholder="용어 검색 (예: EBITDA, 연환산)" /></label>
  <dl id="glossaryList" class="grid gap-3 md:grid-cols-2">${Object.entries(GLOSSARY).map(([k, v]) => `<div class="rounded-lg border p-4" data-term="${esc(k + ' ' + v)}"><dt class="font-medium">${k}</dt><dd class="mt-1 text-sm text-muted-foreground">${v}</dd></div>`).join('')}</dl>
  <p id="glossaryEmpty" class="hidden text-sm text-muted-foreground">찾는 용어가 없습니다.</p>`;

const FAQ = [
  ['프리셋을 고친 뒤 기존 시나리오도 바뀌나요?', '바뀌지 않습니다. 프리셋은 시나리오를 만들 때의 시작 값입니다. 기존 시나리오에 새 프리셋 값을 쓰려면 시뮬레이터에서 프리셋을 다시 고르거나 "프리셋 값으로 되돌리기"를 누릅니다.'],
  ['실적이 12개월이 안 되면 어떻게 계산하나요?', '실적 인원 × 12 ÷ 개월 수로 연환산해 씁니다. 시뮬레이터 상단과 입력판에 "연환산" 표시가 붙습니다.'],
  ['매출 항목을 끄면 입력한 값이 지워지나요?', '지워지지 않습니다. 시뮬레이터에서 보이지 않고 계산에서 빠질 뿐이며, 다시 켜면 이전 값으로 돌아옵니다.'],
  ['EBITDA 밴드가 보이지 않아요.', '하한(보수)과 상한(공격) 프리셋이 모두 있어야 보입니다. 병원 기초정보 > 시나리오 프리셋에서 밴드 역할을 지정하세요.'],
  ['잔존가치 경고는 무엇인가요?', '기업가치의 70% 이상이 Y5 이후 가치에서 나온다는 뜻입니다. WACC·영구성장률을 조금만 바꿔도 EV가 크게 변하므로 민감도 표를 함께 보세요.'],
  ['수식을 바꾸면 바로 반영되나요?', '초안으로 저장한 뒤 승인해야 반영됩니다. 승인 전에는 기존 수식으로 계산합니다.'],
];
const faqBody = `<div class="divide-y rounded-lg border">${FAQ.map(([q, a]) => `<details class="group p-4"><summary class="flex cursor-pointer list-none items-center justify-between gap-3 font-medium">${q}<i data-lucide="chevron-down" class="size-4 shrink-0 text-muted-foreground transition-transform group-open:rotate-180"></i></summary><p class="mt-2 text-sm text-muted-foreground">${a}</p></details>`).join('')}</div>`;

const overview = `<div class="grid gap-3 md:grid-cols-3">
  ${[['hospital', '병원 기초정보', '병원 실적과 매출 항목·재무 상수·프리셋처럼 시나리오가 함께 쓰는 고정 정보를 관리합니다.', 'hospital.html'],
     ['calculator', '시뮬레이터', '프리셋에서 시작한 시나리오의 입력값을 바꿔 5개년 매출·EBITDA·기업가치를 계산하고 저장합니다.', 'simulator.html'],
     ['git-compare', '비교·검토', '여러 시나리오를 나란히 비교하고, 미검증 가정과 수식을 확인합니다.', 'simulator.html']]
    .map(([icon, t, d, href]) => `<a href="${href}" class="space-y-2 rounded-lg border p-4 transition-colors hover:bg-accent/40"><span class="flex size-9 items-center justify-center rounded-lg bg-accent text-accent-foreground"><i data-lucide="${icon}" class="size-5"></i></span><div class="font-medium">${t}</div><p class="text-sm text-muted-foreground">${d}</p></a>`).join('')}
  </div>
  <div class="flex items-start gap-2 rounded-lg bg-muted/60 px-4 py-3 text-sm"><i data-lucide="circle-help" class="mt-0.5 size-4 shrink-0 text-primary"></i><span>화면 곳곳의 <b>물음표 아이콘</b>에 마우스를 올리면(터치 화면은 누르면) 그 항목의 설명이 바로 뜹니다. 설명 문장은 이 가이드의 용어집·입력 항목 설명과 같습니다.</span></div>`;

page.innerHTML = `<div class="grid grid-cols-[minmax(0,1fr)] items-start gap-6 lg:grid-cols-[200px_minmax(0,1fr)]">
  <nav aria-label="가이드 목차" class="lg:sticky lg:top-24"><ul class="flex flex-wrap gap-1 lg:flex-col">${TOC.map(([id, t]) => `<li><a href="#${id}" data-toc="${id}" class="block rounded-md px-3 py-1.5 text-sm text-muted-foreground hover:bg-accent hover:text-foreground">${t}</a></li>`).join('')}</ul></nav>
  <div class="min-w-0 space-y-6">
    ${sec('overview', '이 화면으로 하는 일', `${esc(H.name)}의 실적을 바탕으로 시나리오별 5개년 EBITDA와 기업가치를 계산합니다.`, overview)}
    ${sec('start', '처음 쓰는 순서', '병원 기초정보를 먼저 확인하고 시뮬레이터에서 시나리오를 만듭니다.', steps)}
    ${sec('simulator', '시뮬레이터', '화면은 위에서 아래로 시나리오 → 입력 → 결과 → 비교 순서입니다.', simBody)}
    ${sec('hospital', '병원 기초정보', '시나리오가 함께 쓰는 고정 정보입니다. 병원 시스템이 주는 정보는 읽기만 할 수 있습니다.', hosBody)}
    ${sec('fields', '입력 항목 설명', '시뮬레이터 입력판의 각 항목입니다. 입력판의 물음표 아이콘에도 같은 설명이 나옵니다.', fieldsBody)}
    ${sec('glossary', '용어집', '', glossaryBody)}
    ${sec('faq', '자주 묻는 질문', '', faqBody)}
  </div></div>`;
lucide.createIcons();

/* 목차: 보고 있는 절을 표시한다 */
const tocLinks = [...document.querySelectorAll('[data-toc]')];
const observer = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  tocLinks.forEach(a => a.classList.toggle('bg-accent', a.dataset.toc === e.target.id));
  tocLinks.forEach(a => a.classList.toggle('text-foreground', a.dataset.toc === e.target.id));
}), { rootMargin: '-30% 0px -60% 0px' });
TOC.forEach(([id]) => observer.observe(document.getElementById(id)));

document.getElementById('glossarySearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('[data-term]').forEach(el => { const on = !q || el.dataset.term.toLowerCase().includes(q); el.classList.toggle('hidden', !on); shown += on; });
  document.getElementById('glossaryEmpty').classList.toggle('hidden', shown > 0);
});
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
