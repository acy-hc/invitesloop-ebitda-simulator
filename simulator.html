<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EBITDA 시뮬레이터 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="shared.js"></script>
<script src="engine.js"></script>
<script src="guide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<script>
/* 수식 카드 — 지금은 화면에 보이지 않는다. 계산은 기본식으로 한다 */
const SHOW_FORMULAS = false;

const page = mountShell({
  active: 'simulator', title: '시뮬레이터', guide: 'simulator',
  footer: '시안 + 프로토타입 — 결과는 이 화면 안에서 계산합니다. 병원 기초정보 기본값과 프리셋 입력이면 프로토타입(vista_v4) 기준값과 같은 결과가 나옵니다.',
});

page.innerHTML = `
  <section class="card" aria-label="분석 대상">
    <div class="flex flex-col gap-4 p-6 xl:flex-row xl:items-end xl:justify-between">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
        <div class="space-y-1.5"><label for="scenarioSelect" class="label flex items-center gap-1.5">시나리오${term('시나리오')}</label>
          <div class="flex gap-2"><select id="scenarioSelect" class="select sm:w-80"></select>
            <button type="button" id="compareBtn" class="btn btn-secondary shrink-0" title="새 창에서 다른 시나리오와 비교합니다"><i data-lucide="git-compare"></i>비교하기<i data-lucide="external-link" class="opacity-60"></i></button></div></div>
        <div class="flex flex-wrap gap-2">
          <button type="button" id="newScenario" class="btn btn-outline"><i data-lucide="plus"></i>새 시나리오</button>
          <button type="button" id="copyScenario" class="btn btn-outline"><i data-lucide="copy"></i>복제</button>
          <button type="button" id="deleteScenario" class="btn btn-ghost text-destructive hover:text-destructive"><i data-lucide="trash-2"></i>삭제</button>
        </div>
      </div>
      <div class="flex items-center justify-between gap-3 xl:justify-end">
        <span id="saveState" class="text-sm whitespace-nowrap text-muted-foreground"></span>
        <button type="button" id="saveBtn" class="btn btn-default"><i data-lucide="save"></i>저장</button>
      </div>
    </div>
    <div id="scenarioMeta" class="flex flex-col gap-2 border-t px-6 py-3 lg:flex-row lg:items-center lg:justify-between"></div>
  </section>

  <div class="grid grid-cols-[minmax(0,1fr)] items-start gap-6 lg:grid-cols-[minmax(0,0.78fr)_minmax(0,1.5fr)]">
    <section class="card" aria-label="입력">
      <div class="card-header flex-row items-center justify-between">
        <h2 class="card-title flex items-center gap-1.5">입력${tip('슬라이더·입력칸을 바꾸면 오른쪽 결과가 다시 계산됩니다. 바꾼 뒤에는 상단 저장 버튼으로 저장합니다.')}</h2>
        <span id="driverCaption" class="text-xs text-muted-foreground"></span>
      </div>
      <div class="card-content divide-y" id="driverPanel"></div>
    </section>
    <div class="min-w-0 space-y-6" id="resultPanel"></div>
  </div>
  ${SHOW_FORMULAS ? `<section class="card">
    <div class="card-header"><h2 class="card-title flex items-center gap-1.5">수식${term('수식 세트')}</h2><p class="card-desc">계산에 쓰는 수식입니다. 초안으로 저장한 뒤 승인해야 반영됩니다.</p></div>
    <div class="card-content" id="bottomTab"></div>
  </section>` : ''}`;

/* ---------- 데이터·상태 ---------- */
const HOSPITALS = loadHospitals();
const SCENARIOS = { vista: loadScenarios('vista') };
const persistScenarios = () => saveScenarios(state.hid, scenarios());

const state = { hid: 'vista', scenario: 's1', preset: null, drivers: {}, year: 5, dirty: false, formulas: {} };
/* 계산 결과 — 입력이 바뀔 때마다 다시 계산한다 */
let model = null;
const compute = () => { model = runModel(hosp(), state.drivers, state.formulas); };
const hosp = () => HOSPITALS.find(h => h.id === state.hid);
const scenarios = () => SCENARIOS[state.hid];
const scen = () => scenarios().find(s => s.id === state.scenario);
const presetOf = key => hosp().presets.find(p => p.key === key);
const items = () => hosp().revenueItems.filter(i => i.enabled);

function applyPreset(key) {
  state.preset = presetOf(key) ? key : null;
  state.drivers = presetDrivers(hosp(), key);
}
/* 저장된 시나리오 입력을 불러온다 */
function loadScenario() {
  const sc = scen();
  state.preset = presetOf(sc.preset) ? sc.preset : null;
  state.drivers = scenarioDrivers(hosp(), sc);
  state.dirty = false;
}
function selectHospital(id) {
  state.hid = id; useCurrency(hosp());
  state.scenario = scenarios()[0].id;
  loadScenario();
}
selectHospital('vista');

const results = () => model.years;
const costFields = h => [
  { key: 'opexRate', label: '운영비율', unit: '%', min: 10, max: 35, step: 1, note: '매출 대비' },
  { key: 'mktgRate', label: '마케팅·CAC·간접비', unit: '%', min: 0, max: 50, step: 1, ramp: h.id === 'vista' ? 'Y1×50%' : null },
  { key: 'bizdevK', label: '초기사업개발비', unit: h.report === 'KRW' ? '백만원' : '천$', min: 0, max: 1000, step: 10, note: 'Y1~Y2' },
  { key: 'omRate', label: '유지보수비', unit: '%', min: 0, max: 15, step: 1, note: '매출 대비' },
];
const RESERVOIR = [
  { key: 'churn0', label: '기본 이탈률', unit: '%', min: 10, max: 40, step: 1 },
  { key: 'rpmAdopt', label: 'RPM 침투율', unit: '%', min: 0, max: 80, step: 1 },
  { key: 'rpmDelta', label: 'RPM 이탈감소 효과 δ', unit: '%', min: 0, max: 60, step: 1, warn: '국내 RPM 연구 인용값 — 병원 데이터로 검증 전' },
];
const allFields = () => [...items().flatMap(i => i.fields), ...costFields(hosp()), ...RESERVOIR];
const fieldUnit = f => (f.money ? CUR.sym : '') + (f.unit || '');

/* ---------- 상단: 병원·시나리오 ---------- */
function renderToolbar() {
  document.getElementById('scenarioSelect').innerHTML = scenarios().map(s => `<option value="${s.id}" ${s.id === state.scenario ? 'selected' : ''}>${esc(s.name)} · v${s.version}</option>`).join('');
  const sc = scen();
  document.getElementById('saveState').innerHTML = state.dirty ? '<span class="badge badge-warning">수정됨</span>' : `v${sc.version} · ${sc.updatedAt} 저장`;
  document.getElementById('saveBtn').disabled = !state.dirty;
  document.getElementById('deleteScenario').disabled = scenarios().length <= 1;

  const h = hosp(), p = presetOf(state.preset);
  const bandTag = (x, cls = 'badge-secondary') => x.band ? `<span class="badge ${cls} px-1.5 py-0 text-[10px]">${x.band === 'LOW' ? '하한' : '상한'}</span>` : '';
  /* 프리셋 콤보 — 목록에서 설명과 Y5 EBITDA를 보고 고른다 */
  const options = h.presets.map(x => {
    const on = x.key === state.preset, ebitda = runModel(h, presetDrivers(h, x.key)).years[HORIZON - 1].ebitda;
    return `<button type="button" role="option" aria-selected="${on}" data-preset-pick="${x.key}" class="flex w-full items-start gap-2 rounded-md px-2.5 py-2 text-start outline-none hover:bg-accent focus-visible:bg-accent ${on ? 'bg-accent/60' : ''}">
      <i data-lucide="check" class="mt-0.5 size-4 shrink-0 text-primary ${on ? '' : 'invisible'}"></i>
      <span class="min-w-0 flex-1 space-y-0.5"><span class="flex items-center gap-1.5 text-sm font-medium">${esc(x.name)}${bandTag(x)}<span class="ms-auto text-xs font-normal text-muted-foreground">Y5 EBITDA <b class="tabular-nums text-foreground ${neg(ebitda)}">${F.short(ebitda)}</b></span></span>
        <span class="block text-xs text-muted-foreground">${esc(x.desc)}</span></span>
    </button>`;
  }).join('');
  document.getElementById('scenarioMeta').innerHTML = `
    <div class="flex min-w-0 flex-wrap items-center gap-x-3 gap-y-2 text-sm">
      <span class="flex shrink-0 items-center gap-1 font-medium">프리셋${term('프리셋')}</span>
      <div class="relative" id="presetComboWrap">
        <button type="button" id="presetCombo" aria-haspopup="listbox" aria-expanded="false" class="input flex h-8 w-56 cursor-pointer items-center gap-1.5 text-start">
          <span class="flex min-w-0 flex-1 items-center gap-1.5 truncate">${p ? esc(p.name) + bandTag(p) : '<span class="text-muted-foreground">프리셋 없음</span>'}</span>
          <i data-lucide="chevron-down" class="size-4 shrink-0 text-muted-foreground"></i></button>
        <div id="presetList" role="listbox" aria-label="프리셋" class="absolute start-0 top-full z-40 mt-1 hidden max-h-80 w-[min(28rem,calc(100vw-2rem))] overflow-y-auto rounded-lg border bg-popover p-1 shadow-lg">${options}</div>
      </div>
      <span class="min-w-0 flex-1 truncate text-muted-foreground" title="${esc(p?.desc ?? '')}">${p ? esc(p.desc) : '연결된 프리셋이 삭제되어 시나리오 값만 남아 있습니다.'}</span>
    </div>
    <div class="flex shrink-0 items-center gap-1">
      <button type="button" id="resetPreset" title="저장 전 수정한 값을 버리고 프리셋 값으로 돌립니다" class="btn btn-ghost btn-sm" ${state.dirty && p ? '' : 'disabled'}><i data-lucide="rotate-ccw"></i>되돌리기</button>
      <a href="hospital.html#presets" class="btn btn-ghost btn-sm text-primary"><i data-lucide="settings-2"></i>프리셋 관리</a>
    </div>`;
}
function togglePresetList(open) {
  const list = document.getElementById('presetList'), btn = document.getElementById('presetCombo');
  if (!list) return;
  const next = open ?? list.classList.contains('hidden');
  list.classList.toggle('hidden', !next); btn.setAttribute('aria-expanded', next);
  if (next) (list.querySelector('[aria-selected="true"]') || list.querySelector('[role="option"]'))?.focus();
}

/* ---------- 입력판 ---------- */
function driverRow(it) {
  const s = state.drivers, actualOn = it.actual != null && s[it.key + '@actual'];
  const v = actualOn ? it.actual : s[it.key] ?? it.def;
  if (it.toggle) {
    return `<div class="flex items-center justify-between gap-3 py-1.5"><span class="flex items-center gap-1.5 text-sm">${it.label}${tip(fieldHelp(it), it.label)}</span>${switchHtml(v, `data-toggle="${it.key}"`)}</div>`;
  }
  if (it.yearly) {
    return `<div class="space-y-1.5 py-2"><span class="flex items-center gap-1.5 text-sm">${it.label}${tip(fieldHelp(it), it.label)} <span class="text-xs text-muted-foreground">${CUR.sym}</span></span>
      <div class="grid grid-cols-5 gap-1.5">${YEARS.map(n => `<input type="number" class="input h-8 px-2 text-end text-xs tabular-nums" placeholder="Y${n}" aria-label="${it.label} Y${n}" value="${s[`${it.key}.${n}`] ?? ''}" data-driver="${it.key}.${n}" />`).join('')}</div></div>`;
  }
  const warn = it.warn ? `<span class="badge badge-destructive px-1.5 py-0" title="${esc(it.warn)}">⚠</span>` : '';
  const actual = it.actual != null
    ? `<span class="flex items-center gap-1.5 text-xs text-muted-foreground">${switchHtml(actualOn, `data-toggle="${it.key}@actual" aria-label="${it.label} 실적값 사용"`)}실적값 사용 (${it.actual})${term('실적값 사용')}</span>` : '';
  const ramp = it.ramp != null
    ? `<div class="flex items-center gap-2 text-xs text-muted-foreground"><span class="flex shrink-0 items-center gap-1">Y5 목표${term('Y5 목표')}</span><input type="number" class="input h-7 w-24 px-2 text-xs" placeholder="${+rampTarget(hosp(), { ...s, [it.key + '@5']: null }, it.key, v).toFixed(2)}" value="${s[it.key + '@5'] ?? ''}" data-driver="${it.key}@5" aria-label="${it.label} Y5 목표" /><span>${fieldUnit(it)}</span></div>` : '';
  const control = it.number
    ? `<input type="number" class="input h-8 w-32 text-end tabular-nums" value="${v ?? 0}" data-driver="${it.key}" aria-label="${it.label}" ${actualOn ? 'disabled' : ''}/>`
    : `<input type="range" class="w-full" min="${it.min}" max="${it.max}" step="${it.step}" value="${v ?? it.min}" data-driver="${it.key}" aria-label="${it.label}" ${actualOn ? 'disabled' : ''}/>`;
  return `<div class="space-y-1.5 py-2">
    <div class="flex items-center justify-between gap-2">
      <span class="flex items-center gap-1.5 text-sm">${it.label}${tip(fieldHelp(it), it.label)}${warn}${it.note ? `<span class="text-xs text-muted-foreground">${it.note}</span>` : ''}${it.number ? `<span class="text-xs text-muted-foreground">${fieldUnit(it)}</span>` : ''}</span>
      ${it.number ? control : `<span class="text-sm font-semibold tabular-nums" data-value="${it.key}">${v ?? it.min}${fieldUnit(it)}</span>`}
    </div>
    ${it.number ? '' : control}
    ${ramp || actual ? `<div class="flex flex-wrap items-center justify-between gap-2">${ramp}${actual}</div>` : ''}
  </div>`;
}

const section = (title, content, { open = true, extra = '' } = {}) => `<details ${open ? 'open' : ''} class="group py-3">
  <summary class="flex cursor-pointer list-none items-center justify-between gap-2 text-sm font-semibold"><span class="flex flex-wrap items-center gap-2">${title}</span>
    <span class="flex items-center gap-3">${extra}<i data-lucide="chevron-down" class="size-4 text-muted-foreground transition-transform group-open:rotate-180"></i></span></summary>
  <div class="mt-2">${content}</div></details>`;

function renderDrivers() {
  const h = hosp(), s = state.drivers;
  document.getElementById('driverCaption').textContent = `기준연도 ${h.baseYear} · Y1 = ${h.baseYear + 1}`;

  const volumes = `<table class="w-full text-sm"><thead><tr class="border-b"><th class="th">구분</th><th class="th num">연간 인원</th><th class="th"><span class="inline-flex items-center gap-1">기간${term('집계 기간')}</span></th><th class="th text-end"><span class="inline-flex items-center gap-1">직접 입력${term('직접 입력')}</span></th></tr></thead>
    <tbody>${h.volumes.map(v => { const o = s['vol.' + v.key]; return `<tr class="border-b last:border-0">
      <td class="td">${VOLUME_TYPES.find(t => t.key === v.key).label}</td>
      <td class="td num">${o != null ? `<input type="number" class="input h-8 w-24 text-end tabular-nums" value="${o}" data-driver="vol.${v.key}" aria-label="${VOLUME_TYPES.find(t => t.key === v.key).label} 연간 인원"/><div class="text-[11px] text-muted-foreground">실적 ${F.int(annualized(v))}</div>`
        : `${F.int(annualized(v))}${v.months < 12 ? `<div class="text-[11px] text-muted-foreground">실적 ${F.int(v.count)}</div>` : ''}`}</td>
      <td class="td text-xs text-muted-foreground">${v.from}~${v.to.slice(5)}<div>${v.months}개월${v.months < 12 ? ' · 연환산' : ''}</div></td>
      <td class="td text-end">${switchHtml(o != null, `data-vol="${v.key}" aria-label="직접 입력"`)}</td></tr>`; }).join('')}</tbody></table>
    <p class="mt-2 text-xs text-muted-foreground">병원 시스템 ${h.receivedAt} 수신${h.locations.length > 1 ? ` · ${h.locations.join('·')} 거점 합산` : ''}</p>`;

  const revenue = items().map(it => {
    const on = it.toggle ? s[it.toggle] : true;
    const fields = on ? it.fields.filter(f => !f.whenAny || f.whenAny.some(k => s[k])).map(driverRow).join('') : '<p class="py-2 text-xs text-muted-foreground">사용하지 않음</p>';
    return `<details open class="group/item rounded-lg border px-3 py-2">
      <summary class="flex cursor-pointer list-none items-center justify-between gap-2 text-sm font-medium">
        <span class="flex min-w-0 flex-wrap items-center gap-1.5">${esc(it.name)}${segBadge(it.segment)}${it.toggle ? tip(fieldHelp({ key: it.toggle }), it.name) : ''}</span>
        <span class="flex items-center gap-2">${it.toggle ? switchHtml(on, `data-toggle="${it.toggle}" onclick="event.preventDefault()"`) : ''}<i data-lucide="chevron-down" class="size-4 text-muted-foreground transition-transform group-open/item:rotate-180"></i></span>
      </summary>
      <p class="mt-1 flex flex-wrap items-center gap-1 text-xs text-muted-foreground">${CALC_TYPES[it.type].label}${tip(`${CALC_TYPES[it.type].label}: ${CALC_TYPES[it.type].formula}`)} · 기반 ${BASE_LABEL[it.base] || '없음'}${term('기반 인원')}</p>
      ${fields}</details>`;
  }).join('');
  const revenueBlock = `<div class="space-y-2">${revenue}</div>`;

  const cost = costFields(h).map(driverRow).join('');
  const reservoir = h.reservoir && s.reservoir ? RESERVOIR.map(driverRow).join('') : '<p class="py-1 text-xs text-muted-foreground">구독자 누적을 쓰지 않습니다.</p>';
  const etc = driverRow({ key: 'hcAttr', label: 'CAPEX를 EBITDA 비용에 포함', toggle: true });

  document.getElementById('driverPanel').innerHTML =
    section(`환자 기반 <span class="text-xs font-normal text-muted-foreground">병원 실적</span>${tip('병원 시스템이 보낸 외래·입원·건강검진 인원입니다. 매출 항목은 이 인원에서 계산을 시작합니다.')}`, volumes) +
    section(`매출 항목 <span class="text-xs font-normal text-muted-foreground">${items().length}개</span>${tip('병원 기초정보에서 사용으로 켠 매출 항목입니다. 항목마다 산출 방식에 맞는 입력이 나옵니다.')}`, revenueBlock, { extra: '<a href="hospital.html#items" class="text-xs font-normal text-primary underline-offset-4 hover:underline" onclick="event.stopPropagation()">항목 관리</a>' }) +
    section(`비용${tip('매출 대비 비율이나 금액으로 넣는 비용입니다. 인건비·로열티는 병원 기초정보의 재무 상수에서 정합니다.')}`, cost) +
    (h.reservoir ? section(`구독자 누적 (Reservoir)${tip(fieldHelp({ key: 'reservoir' }))}${s.reservoir ? ` <span class="text-xs font-normal text-muted-foreground">유효 이탈률 ${F.pct(effectiveChurn(h, s))}</span>` : ''}`, reservoir, { extra: switchHtml(s.reservoir, 'data-toggle="reservoir" onclick="event.preventDefault()"') }) : '') +
    section('기타', etc, { open: false });
}

/* ---------- 결과 ---------- */
function waterfallSvg(y) {
  const its = items();
  const segRev = seg => its.filter(i => i.segment === seg).reduce((a, i) => a + (y.rev[i.key] || 0), 0);
  const steps = [['Medical 매출', segRev('Medical')]];
  if (segRev('Commerce')) steps.push(['Commerce 매출', segRev('Commerce')]);
  steps.push(['인건비', -y.cost.labor], ['운영비', -y.cost.opex], ['마케팅', -y.cost.mktg], ['기타 비용', -(y.cost.bizdev + y.cost.royalty + y.cost.om + y.cost.hc)]);
  const W = 680, H = 230, P = { l: 64, r: 12, t: 20, b: 30 };
  let run = 0; const bars = steps.map(([l, v]) => { const from = run; run += v; return { l, from, to: run, v }; });
  bars.push({ l: 'EBITDA', from: 0, to: run, v: run, total: true });
  const [min, max] = niceScale(Math.min(0, ...bars.map(b => Math.min(b.from, b.to))), Math.max(...bars.map(b => Math.max(b.from, b.to))));
  const yPos = v => P.t + (max - v) / (max - min) * (H - P.t - P.b), bw = (W - P.l - P.r) / bars.length;
  return `<svg viewBox="0 0 ${W} ${H}" class="h-auto w-full" role="img" aria-label="EBITDA 구성">
    <line x1="${P.l}" x2="${W - P.r}" y1="${yPos(0)}" y2="${yPos(0)}" stroke="var(--muted-foreground)" stroke-opacity=".5"/>
    ${[min, max].map(v => `<text x="${P.l - 8}" y="${yPos(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted-foreground)">${F.short(v)}</text>`).join('')}
    ${bars.map((b, i) => {
      const x = P.l + i * bw + bw * 0.18, w = bw * 0.64, top = yPos(Math.max(b.from, b.to)), h = Math.max(Math.abs(yPos(b.from) - yPos(b.to)), 1);
      const fill = b.total ? (b.v < 0 ? 'var(--destructive)' : 'var(--chart-1)') : b.v < 0 ? 'var(--chart-5)' : b.l.startsWith('Commerce') ? 'var(--chart-2)' : 'var(--chart-3)';
      return `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="4" fill="${fill}"><title>${b.l} ${F.money(b.v)}</title></rect>
        <text x="${x + w / 2}" y="${top - 5}" text-anchor="middle" font-size="11" fill="var(--foreground)">${F.short(b.v)}</text>
        <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">${b.l}</text>`;
    }).join('')}
  </svg>`;
}

/* ---------- 수식 ---------- */
const traceNum = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 4 });
/* 선택 연도의 대입값 — 같은 수식이 거점·연도마다 여러 번 쓰인다 */
function tracesOf(key) {
  const re = new RegExp(`Y${state.year}(\\s|$)`);
  return [...model.ctx.traces.values()].filter(t => t.key === key && re.test(t.label));
}
function renderBottom() {

      <div class="flex flex-wrap items-center gap-2">

      </div>
    </div>
    ${edited.length ? '<div class="flex items-start gap-2 rounded-lg border border-warning/60 bg-warning/10 px-3 py-2 text-sm"><i data-lucide="flask-conical" class="mt-0.5 size-4 shrink-0 text-warning"></i>수정한 수식으로 이 화면의 결과를 바로 계산해 보고 있습니다. 승인 전이므로 저장한 시나리오와 비교 창은 기본식으로 계산합니다.</div>' : ''}
    <p class="text-xs text-muted-foreground">숫자·변수·사칙연산·괄호와 min·max·abs·round·floor·ceil·pow만 쓸 수 있습니다. 틀린 수식은 기본식으로 계산하고 오류를 표시합니다.</p>
    <div class="divide-y rounded-lg border">${FORMULA_META.map(m => {

        <div class="space-y-1">
          <div class="flex flex-wrap items-center gap-2"><span class="font-semibold">${m.label}</span><code class="rounded bg-muted px-1.5 py-0.5 text-xs">${m.key}</code>${state.formulas[m.key] != null ? '<span class="badge badge-warning">수정됨</span>' : ''}</div>
          <p class="text-sm text-muted-foreground">${m.meaning}</p>
          <p class="text-xs text-muted-foreground">변수 — ${m.variables}</p>
          <p class="text-xs text-muted-foreground">반영 — ${m.impact}</p>

        <div class="space-y-2">
          <textarea data-formula="${m.key}" rows="2" spellcheck="false" class="textarea font-mono text-xs ${err ? 'border-destructive' : ''}">${esc(expr)}</textarea>
          <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
            <span data-formula-error="${m.key}" class="text-destructive">${err ? esc(err) + ' — 기본식으로 계산했습니다.' : ''}</span>
            ${state.formulas[m.key] != null ? `<button type="button" class="text-primary underline-offset-4 hover:underline" data-formula-reset="${m.key}">기본식으로</button>` : ''}
          </div>
          <details class="text-xs"><summary class="cursor-pointer text-muted-foreground">대입값 보기 · Y${state.year} (${tr.length}건)</summary>
            <div class="mt-2 max-h-56 space-y-1 overflow-auto rounded-md bg-muted p-3 font-mono">${tr.length ? tr.map(t => `<div><span class="text-muted-foreground">${esc(t.label)}</span> ${Object.entries(t.vars).map(([k, v]) => `${k}=${traceNum(v)}`).join(', ')} <b>→ ${traceNum(t.value)}</b></div>`).join('') : '<span class="text-muted-foreground">이 연도에는 쓰이지 않았습니다.</span>'}</div></details>

/* 수식을 입력하는 동안에는 칸을 다시 그리지 않고 오류 문구만 바꾼다 — 다시 그리면 입력 중인 칸의 포커스를 잃는다 */
function updateFormulaStatus() {
  const errors = model.ctx.errors;
  document.getElementById('formulaStatus').textContent = `수정 ${Object.keys(state.formulas).length}개 · 오류 ${errors.size}개`;
  document.querySelectorAll('[data-formula-error]').forEach(el => {
    const err = errors.get(el.dataset.formulaError);
    el.textContent = err ? err + ' — 기본식으로 계산했습니다.' : '';
    document.querySelector(`[data-formula="${el.dataset.formulaError}"]`).classList.toggle('border-destructive', !!err);
  });
}

    body: `<form id="nsForm" class="space-y-5" onsubmit="return false">
      <label class="block space-y-1.5"><span class="label">시나리오 이름 <span class="text-destructive">*</span></span>
        <input id="nsName" class="input" maxlength="30" placeholder="예: 2027 투자 유치안" value="${isCopy ? esc(cur.name + ' 사본').slice(0, 30) : ''}" autocomplete="off"/>
        <span class="flex justify-between text-xs"><span id="nsMsg" class="text-destructive"></span><span id="nsCount" class="text-muted-foreground">0/30</span></span></label>
      <label class="block space-y-1.5"><span class="label">설명</span>
        <textarea id="nsDesc" rows="2" maxlength="100" class="textarea" placeholder="시나리오의 목적이나 전제를 적어 두세요."></textarea></label>
      ${isCopy
        ? `<div class="rounded-lg bg-muted/60 px-4 py-3 text-sm"><span class="text-muted-foreground">프리셋</span> <b>${esc(presetOf(state.preset)?.name ?? '없음')}</b> · 입력값 ${state.dirty ? '(저장 전 수정 포함)' : ''} 그대로 복사</div>`
        : `<fieldset class="space-y-2"><legend class="label">시작 프리셋 <span class="text-destructive">*</span></legend>
            <p class="text-xs text-muted-foreground">선택한 프리셋 값으로 입력이 채워집니다. 프리셋은 <a href="hospital.html#presets" class="text-primary underline-offset-4 hover:underline">병원 기초정보</a>에서 추가·수정합니다.</p>
            <div class="grid gap-2 sm:grid-cols-2">${presetChoices}</div></fieldset>`}
    </form>`,
    footer: `<button type="button" class="btn btn-outline" data-close>취소</button><button type="button" class="btn btn-default" id="nsSubmit">${isCopy ? '복제' : '만들기'}</button>`,
    onMount: (el, close) => {
      const name = el.querySelector('#nsName'), submit = el.querySelector('#nsSubmit');
      const validate = () => {
        const v = name.value.trim(), dup = scenarios().some(s => s.name === v);
        el.querySelector('#nsCount').textContent = `${name.value.length}/30`;
        el.querySelector('#nsMsg').textContent = dup ? '같은 이름의 시나리오가 있습니다.' : '';
        submit.disabled = !v || dup;
      };
      name.addEventListener('input', validate); validate();
      submit.addEventListener('click', () => {
        const preset = isCopy ? state.preset : el.querySelector('input[name="nsPreset"]:checked').value;
        const s = { id: 'n' + Date.now(), name: name.value.trim(), desc: el.querySelector('#nsDesc').value.trim(), preset, version: 1, updatedAt: stampNow(), drivers: isCopy ? structuredClone(state.drivers) : presetDrivers(h, preset) };
        scenarios().push(s); persistScenarios();
        state.scenario = s.id; loadScenario();
        close(); renderAll(); toast(isCopy ? '시나리오를 복제했습니다.' : '시나리오를 만들었습니다.');
      });
    },
  });
}

/* ---------- 비교 창 ---------- */
function stampNow() {
  const now = new Date(), p = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
}
/* 같은 이름의 창을 다시 쓴다 — 비교하기를 여러 번 눌러도 비교 창은 하나다 */
function openCompare() {
  const w = window.open(`compare.html?base=${encodeURIComponent(state.scenario)}`, 'ebitda-compare', 'popup,width=1360,height=900');
  if (!w) { toast('팝업이 차단되었습니다. 브라우저에서 이 사이트의 팝업을 허용해 주세요.'); return; }
  w.focus();
  if (state.dirty) toast('저장 전 수정값은 비교에 들어가지 않습니다.');
}

/* 프리셋을 고르면 입력 전체를 그 프리셋 값으로 바꾼다 — 수정한 값이 있으면 먼저 묻는다 */
function pickPreset(key) {
  if (key === state.preset && !state.dirty) return;
  const apply = () => { applyPreset(key); state.dirty = true; renderAll(); };
  if (state.dirty) confirmModal('입력값이 프리셋 값으로 바뀝니다. 계속할까요?', apply);
  else apply();
}

/* ---------- 이벤트 ---------- */
function renderAll() { compute(); renderToolbar(); renderDrivers(); renderResults(); renderBottom(); lucide.createIcons(); }
function rerenderResults() { renderResults(); renderBottom(); lucide.createIcons(); }
/* 슬라이더를 끄는 동안 한 프레임에 한 번만 다시 계산한다 */
let pending = 0;
function recalc({ formulaTyping = false } = {}) {
  cancelAnimationFrame(pending);
  pending = requestAnimationFrame(() => {
    compute(); renderResults();
    if (formulaTyping) updateFormulaStatus(); else renderBottom();
    lucide.createIcons();
  });
}

document.addEventListener('click', e => {
    if (!e.target.closest('#presetComboWrap')) togglePresetList(false);
  const t = e.target.closest('#presetCombo,[data-preset-pick],[data-year],[data-toggle],[data-vol],[data-formula-reset],[data-formula-draft],#saveBtn,#compareBtn,#newScenario,#copyScenario,#deleteScenario,#resetPreset');
  if (!t) return;
  if (t.id === 'presetCombo') togglePresetList();
  else if (t.dataset.presetPick) { togglePresetList(false); pickPreset(t.dataset.presetPick); }
  else if (t.dataset.year) { state.year = +t.dataset.year; rerenderResults(); }
  else if (t.dataset.toggle) { state.drivers[t.dataset.toggle] = !state.drivers[t.dataset.toggle]; state.dirty = true; renderAll(); }
  else if (t.dataset.vol) {
    const k = 'vol.' + t.dataset.vol, v = hosp().volumes.find(x => x.key === t.dataset.vol);
    if (state.drivers[k] != null) delete state.drivers[k]; else state.drivers[k] = annualized(v);
    state.dirty = true; renderAll();
  }
  else if (t.dataset.formulaReset !== undefined) {
    if (t.dataset.formulaReset) delete state.formulas[t.dataset.formulaReset]; else state.formulas = {};
    renderAll();
  }
  else if (t.dataset.formulaDraft !== undefined) toast('수식 초안을 저장했습니다. 승인하면 모든 시나리오에 반영됩니다.');
  else if (t.id === 'saveBtn') { const s = scen(); s.version += 1; s.preset = state.preset ?? s.preset; s.drivers = structuredClone(state.drivers); s.updatedAt = stampNow(); persistScenarios(); state.dirty = false; renderToolbar(); lucide.createIcons(); toast('저장했습니다.'); }
  else if (t.id === 'compareBtn') openCompare();
  else if (t.id === 'newScenario') scenarioModal('new');
  else if (t.id === 'copyScenario') scenarioModal('copy');
  else if (t.id === 'deleteScenario') confirmModal(`"${esc(scen().name)}" 시나리오를 삭제합니다. 되돌릴 수 없습니다.`, () => {
    SCENARIOS[state.hid] = scenarios().filter(s => s.id !== state.scenario);
    persistScenarios();
    state.scenario = scenarios()[0].id; loadScenario();
    renderAll(); toast('삭제했습니다.');
  }, { okLabel: '삭제', destructive: true, title: '시나리오 삭제' });
  else if (t.id === 'resetPreset') confirmModal('입력값이 프리셋 값으로 바뀝니다. 계속할까요?', () => { applyPreset(state.preset); state.dirty = false; renderAll(); });
});
/* 프리셋 목록 — Esc로 닫고 위·아래 화살표로 옮긴다 */
document.addEventListener('keydown', e => {
  const list = document.getElementById('presetList');
  if (!list || list.classList.contains('hidden')) return;
  if (e.key === 'Escape') { e.stopPropagation(); togglePresetList(false); document.getElementById('presetCombo').focus(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const opts = [...list.querySelectorAll('[role="option"]')], i = opts.indexOf(document.activeElement);
  opts[(i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.driver;
  if (k) {
    // Y5 목표·연도별 금액은 비우면 기본값으로 돌아간다
    if (e.target.value === '' && k.includes('@5')) delete state.drivers[k];
    else state.drivers[k] = e.target.value === '' ? null : +e.target.value;
    state.dirty = true;
    const out = document.querySelector(`[data-value="${CSS.escape(k)}"]`), f = allFields().find(i => i.key === k);
    if (out && f) out.textContent = e.target.value + fieldUnit(f);
    // 마케팅비율 Y5 목표의 기본값(Y1의 절반)이 함께 바뀐다
    if (k === 'mktgRate') { const t = document.querySelector('[data-driver="mktgRate@5"]'); if (t) t.placeholder = +(+e.target.value * 0.5).toFixed(2); }
    renderToolbar(); recalc();
  }
  const fk = e.target.dataset.formula;
  if (fk) {
    const v = e.target.value.trim();
    if (!v || v === FORMULA_DEFAULTS[fk]) delete state.formulas[fk]; else state.formulas[fk] = v;
    recalc({ formulaTyping: true });
  }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'scenarioSelect') {
    state.scenario = e.target.value; loadScenario();
    renderAll();
  }
  if (e.target.dataset.formula) { renderBottom(); lucide.createIcons(); }
});

renderAll();
</script>
</body>
</html>
