<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>성과 설정 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="shared.js"></script>
<script src="engine.js"></script>
<script src="kpi-engine.js"></script>
<script src="perf-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<script>
const page = mountShell({
  active: 'kpi-setting', title: '성과 설정',
  footer: '시안 — 이 화면에서 저장한 KPI·목표·데이터 항목·데이터 값은 이 브라우저에 저장되고 병원정보 화면 계산에 바로 쓰입니다. 데이터는 VISTA 예시값입니다.',
});

const TABS = [
  { key: 'input', label: '데이터 입력', icon: 'table-2', help: '연동하지 않는 데이터를 주·월 단위로 입력합니다.' },
  { key: 'kpis', label: 'KPI 항목', icon: 'list-checks', help: '병원정보에서 볼 KPI와 계산식, EBITDA 환산 방식을 정합니다.' },
  { key: 'targets', label: '기준·목표', icon: 'flag', help: 'KPI마다 기준값과 목표값, 목표 시점을 정합니다.' },
  { key: 'items', label: '데이터 항목', icon: 'database', help: '병원에서 받는 원자료와 수집 방식을 정합니다.' },
];
const HID = 'vista';
const H = loadHospitals().find(h => h.id === HID);
useCurrency(H);
let P = loadPerf(HID);
const persist = () => savePerf(HID, P);
const fx = year => fxRate(H, year);

const hashTab = location.hash.slice(1);
const state = { tab: TABS.some(t => t.key === hashTab) ? hashTab : 'input', role: 'CUSTOMER_ADMIN', cycle: 'MONTH', end: { MONTH: LATEST_MONTH, WEEK: '2026-W40', QUARTER: '2026Q3' }, edits: {} };
const canEdit = () => state.role !== 'CUSTOMER_DEVELOPER';   // 설정 편집·보정 (D31)
const itemOf = k => P.items.find(i => i.key === k);
const kpiOf = k => P.kpis.find(x => x.key === k);
const stampNow = () => { const n = new Date(), p = x => String(x).padStart(2, '0'); return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`; };
const card = (title, desc, body, right = '', help = '') => `<section class="card"><div class="card-header flex-row flex-wrap items-start justify-between gap-3"><div class="space-y-1.5"><h2 class="card-title flex items-center gap-1.5">${title}${tip(help)}</h2>${desc ? `<p class="card-desc">${desc}</p>` : ''}</div><div class="flex flex-wrap items-center gap-2">${right}</div></div><div class="card-content">${body}</div></section>`;
const readOnlyNote = () => canEdit() || state.tab === 'input' ? '' : '<div class="flex items-center gap-2 rounded-lg border bg-muted/60 px-4 py-2.5 text-sm"><i data-lucide="lock" class="size-4 text-muted-foreground"></i>조회 권한만 있습니다. KPI·목표·데이터 항목은 고객 관리자 이상이 편집합니다.</div>';
const dis = () => canEdit() ? '' : 'disabled';
const isLocked = (item, cycle, period) => item.collectionMethod === 'INTERFACE' && item.interfaceFrom && (cycle === 'WEEK' ? isoWeekStart(period) >= isoWeekStart(item.interfaceFrom) : period >= item.interfaceFrom);
const fmtRaw = (item, v) => v == null ? '' : item.unit === 'AMOUNT' ? Math.round(v).toLocaleString('en-US') : (+v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const num = s => { const t = String(s).replace(/,/g, '').trim(); return t === '' ? null : Number(t); };
const periodShort = (cycle, p) => cycle === 'MONTH' ? `${p.slice(0, 4)}.${p.slice(4)}` : cycle === 'WEEK' ? `${p.slice(2, 4)}-W${p.slice(6)}` : `${p.slice(0, 4)} ${p.slice(4)}`;
const unitText = item => item.unit === 'AMOUNT' ? H.currency : item.unit;

/* ---------- 상단 ---------- */
function renderTop() {
  return `<div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2"><div class="overflow-x-auto"><div class="tabs-list" role="tablist">${TABS.map(t => `<button type="button" class="tabs-trigger" role="tab" data-tab="${t.key}" data-state="${t.key === state.tab ? 'active' : 'inactive'}"><i data-lucide="${t.icon}" class="size-4"></i>${t.label}</button>`).join('')}</div></div>
      <p class="text-sm text-muted-foreground">${TABS.find(t => t.key === state.tab).help}</p></div>
    <label class="flex items-center gap-2 text-xs text-muted-foreground">시안 역할${tip('시안 전용 — 역할에 따라 버튼이 어떻게 달라지는지 봅니다 (D31).')}<select id="roleSelect" class="select h-8 w-36 text-xs"><option value="CUSTOMER_ADMIN" ${state.role === 'CUSTOMER_ADMIN' ? 'selected' : ''}>고객 관리자</option><option value="CUSTOMER_DEVELOPER" ${state.role === 'CUSTOMER_DEVELOPER' ? 'selected' : ''}>고객 개발자</option></select></label>
  </div>`;
}

/* ---------- 데이터 입력 ---------- */
function inputPeriods() {
  const c = state.cycle, end = state.end[c], n = c === 'QUARTER' ? 4 : 6;
  if (c === 'WEEK') { const out = [end]; let s = isoWeekStart(end).getTime(); for (let i = 1; i < n; i++) { s -= 7 * 864e5; out.unshift(isoWeekKey(new Date(s))); } return out; }
  if (c === 'MONTH') return Array.from({ length: n }, (_, i) => mKey(mIndex(end) - (n - 1 - i)));
  const [y, q] = [+end.slice(0, 4), +end.slice(5)]; return Array.from({ length: n }, (_, i) => { const t = y * 4 + q - 1 - (n - 1 - i); return `${Math.floor(t / 4)}Q${(t % 4) + 1}`; });
}
function shiftEnd(dir) {
  const c = state.cycle, e = state.end[c], step = c === 'QUARTER' ? 2 : 3;
  if (c === 'MONTH') state.end.MONTH = mKey(Math.min(mIndex(e) + dir * step, mIndex(LATEST_MONTH) + 1));
  else if (c === 'WEEK') state.end.WEEK = isoWeekKey(new Date(isoWeekStart(e).getTime() + dir * step * 7 * 864e5));
  else { const t = +e.slice(0, 4) * 4 + +e.slice(5) - 1 + dir * step; state.end.QUARTER = `${Math.floor(t / 4)}Q${(t % 4) + 1}`; }
}
/* 칸 검증 — 형식 오류는 저장을 막고, 변동·분자>분모는 경고만 한다 */
function checkCell(item, cycle, period, raw, periods) {
  if (raw == null || String(raw).trim() === '') return {};
  const v = num(raw);
  if (!Number.isFinite(v)) return { error: '숫자를 입력하세요.' };
  if (v < 0 && !item.allowNegative) return { error: '0 이상의 숫자를 입력하세요.' };
  const idx = periods.indexOf(period);
  const prevKey = idx > 0 ? periods[idx - 1] : (cycle === 'MONTH' ? mKey(mIndex(period) - 1) : null);
  const prev = prevKey ? cellValue(item, cycle, prevKey) : null;
  if (prev && Math.abs(v - prev) / prev > 0.5) return { warn: '직전 기간보다 50% 넘게 바뀌었습니다. 값을 확인해 주세요.' };
  if (item.denominatorItemKey) { const d = cellValue(itemOf(item.denominatorItemKey), cycle, period); if (d != null && v > d) return { warn: `${item.name}이(가) ${itemOf(item.denominatorItemKey).name}보다 큽니다.` }; }
  return {};
}
function cellValue(item, cycle, period) {
  const k = valueKey(item.key, cycle, period);
  if (state.edits[k] !== undefined) return num(state.edits[k]);
  return P.values[k]?.value ?? null;
}
function inputTab() {
  const used = usedItemKeys(P), cycles = [...new Set(P.items.filter(i => used.has(i.key)).map(i => i.cycle))];
  if (!cycles.includes(state.cycle)) state.cycle = cycles.includes('MONTH') ? 'MONTH' : cycles[0];
  const periods = inputPeriods(), miss = missingCells(P), mine = miss.filter(m => m.item.cycle === state.cycle);
  const diffCount = Object.entries(P.values).filter(([k, v]) => v.interfaceValue != null && v.source !== 'OVERRIDE' && v.interfaceValue !== v.value && k.split('|')[1] === state.cycle).length;
  const seen = new Set();
  const groups = P.kpis.filter(k => k.enabled).map(k => {
    const keys = [...new Set([...kpiItemKeys(k), ...subItemKeys(k)])].filter(x => itemOf(x)?.cycle === state.cycle);
    const own = keys.filter(x => !seen.has(x)), shared = keys.filter(x => seen.has(x));
    own.forEach(x => seen.add(x));
    return { k, own, shared };
  }).filter(g => g.own.length || g.shared.length);
  const changed = Object.keys(state.edits), warns = [], errors = [];
  const cellHtml = (item, p) => {
    const key = valueKey(item.key, state.cycle, p), v = P.values[key], edit = state.edits[key];
    const locked = isLocked(item, state.cycle, p), dl = deadlineOf(item, state.cycle, p), left = daysBetween(MOCK_TODAY, dl);
    const empty = (edit !== undefined ? String(edit).trim() === '' : !v);
    const overdue = empty && left < 0, soon = empty && left >= 0 && left <= 3;
    const chk = edit !== undefined ? checkCell(item, state.cycle, p, edit, periods) : {};
    if (chk.error) errors.push(key); if (chk.warn) warns.push(key);
    const diff = v?.interfaceValue != null && v.source !== 'OVERRIDE' && v.interfaceValue !== v.value && !locked;
    const menu = `<button type="button" data-cell="${key}" class="absolute end-0.5 top-0.5 rounded p-0.5 text-muted-foreground opacity-60 hover:bg-accent hover:opacity-100" aria-label="칸 메뉴"><i data-lucide="more-vertical" class="size-3"></i></button>`;
    const flags = `${v?.status === 'PROVISIONAL' ? '<span class="badge badge-outline px-1 py-0 text-[9px]">잠정</span>' : ''}${diff ? `<span class="size-1.5 rounded-full bg-warning" title="연동 값 ${fmtRaw(item, v.interfaceValue)}이(가) 입력한 값과 다릅니다"></span>` : ''}${v?.source === 'OVERRIDE' ? '<span class="badge badge-warning px-1 py-0 text-[9px]">보정</span>' : ''}`;
    if (locked) return `<td class="td relative p-1"><div class="flex h-8 items-center justify-end gap-1 rounded-md bg-muted/60 px-2 text-end tabular-nums ${v?.source === 'OVERRIDE' ? 'ring-1 ring-warning' : ''}" title="${v?.source === 'OVERRIDE' ? `보정: ${esc(v.overrideReason)} · 원래 연동 값 ${fmtRaw(item, v.interfaceValue)}` : '병원 시스템에서 연동되는 값이라 여기서 고칠 수 없습니다.'}">${flags}${v ? fmtRaw(item, v.value) : '<span class="text-muted-foreground">대기</span>'}<i data-lucide="plug" class="size-3 text-muted-foreground"></i></div>${menu}</td>`;
    const ring = chk.error ? 'border-destructive ring-1 ring-destructive' : chk.warn ? 'border-warning ring-1 ring-warning' : edit !== undefined ? 'border-warning bg-warning/10' : overdue ? 'border-destructive' : '';
    return `<td class="td relative p-1"><div class="flex items-center gap-1">${flags}<input class="input h-8 min-w-24 px-2 text-end text-xs tabular-nums ${ring} ${v?.status === 'PROVISIONAL' ? 'italic' : ''}" data-input="${key}" value="${edit !== undefined ? esc(edit) : fmtRaw(item, v?.value)}" placeholder="${overdue ? '누락' : soon ? '기한 임박' : ''}" title="${esc(chk.error || chk.warn || (overdue ? `입력 기한 ${dl} 지남` : `입력 기한 ${dl}`))}" aria-label="${esc(item.name)} ${p}"/></div>${menu}</td>`;
  };
  const head = `<tr class="border-b"><th class="th sticky start-0 z-10 bg-card">데이터 항목</th>${periods.map(p => { const dl = deadlineOf(P.items[0], state.cycle, p); return `<th class="th num"><div>${periodShort(state.cycle, p)}</div><div class="text-[10px] font-normal ${daysBetween(MOCK_TODAY, dl) < 0 ? '' : 'text-warning-foreground'}">기한 ${dl.slice(5).replace('-', '/')}</div></th>`; }).join('')}</tr>`;
  const rows = groups.map(g => `<tr class="bg-muted/50"><td class="td sticky start-0 z-10 bg-muted text-xs font-semibold" colspan="${periods.length + 1}">${esc(g.k.name)}${g.shared.length ? ` <span class="font-normal text-muted-foreground">· 공통 항목: ${g.shared.map(x => esc(itemOf(x).name)).join(', ')}</span>` : ''}</td></tr>
    ${g.own.map(x => { const it = itemOf(x); return `<tr class="border-b"><td class="td sticky start-0 z-10 bg-card"><span class="flex items-center gap-1.5"><i data-lucide="${COLLECTION[it.collectionMethod].icon}" class="size-3.5 text-muted-foreground" title="${COLLECTION[it.collectionMethod].label}"></i><span class="max-w-[200px] truncate">${esc(it.name)}</span><span class="text-xs text-muted-foreground">${unitText(it)}</span></span></td>${periods.map(p => cellHtml(it, p)).join('')}</tr>`; }).join('')}`).join('');
  const toolbar = `<div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <div class="tabs-list" role="tablist">${['WEEK', 'MONTH', 'QUARTER'].map(c => `<button type="button" class="tabs-trigger" role="tab" data-incycle="${c}" data-state="${state.cycle === c ? 'active' : 'inactive'}" ${cycles.includes(c) ? '' : 'disabled style="opacity:.45" title="이 주기로 모으는 데이터 항목이 없습니다"'}>${CYCLE_LABEL[c]}</button>`).join('')}</div>
      <div class="flex items-center gap-1"><button type="button" class="btn btn-outline btn-icon" data-shift="-1" aria-label="이전 기간"><i data-lucide="chevron-left"></i></button><span class="min-w-36 text-center text-sm tabular-nums">${periodShort(state.cycle, periods[0])} ~ ${periodShort(state.cycle, periods[periods.length - 1])}</span><button type="button" class="btn btn-outline btn-icon" data-shift="1" aria-label="다음 기간"><i data-lucide="chevron-right"></i></button></div>
      ${mine.filter(m => m.overdue).length ? `<span class="badge badge-destructive">누락 ${mine.filter(m => m.overdue).length}</span>` : ''}${mine.filter(m => !m.overdue).length ? `<span class="badge badge-warning">기한 임박 ${mine.filter(m => !m.overdue).length}</span>` : ''}${diffCount ? `<span class="badge badge-outline"><span class="size-1.5 rounded-full bg-warning"></span>연동 값 차이 ${diffCount}</span>` : ''}
    </div>
    <div class="flex items-center gap-2"><button type="button" class="btn btn-outline btn-sm" id="downloadTpl"><i data-lucide="download"></i>양식 내려받기</button><label class="btn btn-outline btn-sm"><i data-lucide="upload"></i>파일 올리기<input type="file" id="uploadFile" accept=".csv,text/csv" class="hidden"/></label></div>
  </div>`;
  const legendRow = `<div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-muted-foreground">${Object.values(COLLECTION).map(c => `<span class="flex items-center gap-1"><i data-lucide="${c.icon}" class="size-3"></i>${c.label}</span>`).join('')}<span class="flex items-center gap-1"><span class="size-1.5 rounded-full bg-warning"></span>연동 값 차이${term('연동 값 차이')}</span><span class="flex items-center gap-1"><span class="badge badge-warning px-1 py-0 text-[9px]">보정</span>${term('보정')}</span><span>칸의 ⋮ 메뉴: 값 이력·잠정 표시${canEdit() ? '·연동 값 반영·보정' : ''}</span></div>`;
  const bar = `<div class="sticky bottom-0 z-20 -mx-1 flex flex-wrap items-center justify-between gap-3 rounded-xl border bg-card/95 px-5 py-3 shadow-sm backdrop-blur">
    <span class="text-sm text-muted-foreground" id="inputBarText">${barText(changed.length, warns.length, errors.length)}</span>
    <div class="flex gap-2"><button type="button" class="btn btn-outline" id="inputReset" ${changed.length ? '' : 'disabled'}>취소</button><button type="button" class="btn btn-default" id="inputSave" ${changed.length && !errors.length ? '' : 'disabled'}><i data-lucide="save"></i>저장</button></div></div>`;
  return card(`데이터 입력 · ${CYCLE_LABEL[state.cycle]} 단위`, `사용 중인 KPI가 쓰는 데이터 항목입니다. 금액은 병원 통화(${H.currency})로 입력합니다. 연동 항목은 잠긴 칸으로 보입니다.`, `<div class="space-y-3">${toolbar}${legendRow}
    <div class="overflow-x-auto rounded-lg border"><table class="w-full text-sm"><thead>${head}</thead><tbody>${rows || `<tr><td class="td text-muted-foreground" colspan="${periods.length + 1}">이 주기로 모으는 데이터 항목이 없습니다.</td></tr>`}</tbody></table></div>${bar}</div>`);
}
const barText = (n, w, er) => n ? `변경 <b class="text-foreground">${n}</b>칸${w ? ` · 경고 ${w}` : ''}${er ? ` · <span class="text-destructive">오류 ${er}</span>` : ''}` : '바꾼 칸이 없습니다. 기한: 주 데이터는 다음 주 수요일, 월 데이터는 다음 달 10일.';
/* 입력하는 동안에는 표를 다시 그리지 않는다 — 다시 그리면 포커스와 버튼 클릭을 잃는다. 칸 테두리와 저장 막대만 바꾼다 */
function updateInputStatus() {
  const periods = inputPeriods();
  let w = 0, er = 0;
  document.querySelectorAll('[data-input]').forEach(inp => {
    const key = inp.dataset.input, [ik, cycle, p] = key.split('|'), edited = state.edits[key] !== undefined;
    const chk = edited ? checkCell(itemOf(ik), cycle, p, state.edits[key], periods) : {};
    if (chk.error) er++; if (chk.warn) w++;
    inp.classList.toggle('border-destructive', !!chk.error); inp.classList.toggle('ring-1', !!(chk.error || chk.warn));
    inp.classList.toggle('ring-destructive', !!chk.error); inp.classList.toggle('border-warning', !chk.error && (edited || !!chk.warn)); inp.classList.toggle('ring-warning', !!chk.warn);
    inp.classList.toggle('bg-warning/10', edited && !chk.error && !chk.warn);
    if (chk.error || chk.warn) inp.title = chk.error || chk.warn;
  });
  const n = Object.keys(state.edits).length;
  document.getElementById('inputBarText').innerHTML = barText(n, w, er);
  document.getElementById('inputSave').disabled = !n || er > 0;
  document.getElementById('inputReset').disabled = !n;
}
/* 칸 메뉴 — 값 이력, 잠정 표시, 연동 값 반영·보정 (D25) */
function cellModal(key) {
  const [ik, cycle, period] = key.split('|'), item = itemOf(ik), v = P.values[key], locked = isLocked(item, cycle, period);
  const hist = [...(P.history[key] || [])].reverse();
  const diff = v?.interfaceValue != null && v.source !== 'OVERRIDE' && v.interfaceValue !== v.value && !locked;
  openModal({
    title: `${esc(item.name)} · ${periodLabel(cycle, period)}`, size: 'max-w-lg',
    desc: `${COLLECTION[item.collectionMethod].label}${item.interfaceFrom ? ` (연동 시작 ${item.interfaceFrom})` : ''} · 입력 기한 ${deadlineOf(item, cycle, period)} · 단위 ${unitText(item)}`,
    body: `<div class="space-y-4 text-sm">
      <dl class="grid grid-cols-2 gap-3 rounded-lg bg-muted/60 p-3"><div><dt class="text-xs text-muted-foreground">현재 값</dt><dd class="font-semibold tabular-nums">${v ? fmtRaw(item, v.value) : '-'}</dd></div><div><dt class="text-xs text-muted-foreground">출처 · 상태</dt><dd>${v ? `${v.source === 'OVERRIDE' ? '보정' : COLLECTION[v.source]?.label ?? v.source} · ${v.status === 'PROVISIONAL' ? '잠정' : '확정'}` : '-'}</dd></div>
        ${v?.interfaceValue != null ? `<div><dt class="text-xs text-muted-foreground">연동 값</dt><dd class="tabular-nums">${fmtRaw(item, v.interfaceValue)}</dd></div>` : ''}${v?.overrideReason ? `<div class="col-span-2"><dt class="text-xs text-muted-foreground">보정 사유</dt><dd>${esc(v.overrideReason)}</dd></div>` : ''}
        ${v ? `<div class="col-span-2 text-xs text-muted-foreground">${v.updatedAt} · ${esc(v.updatedBy)}</div>` : ''}</dl>
      ${v && !locked ? `<label class="flex items-center gap-2"><input type="checkbox" id="cmProv" class="size-4" ${v.status === 'PROVISIONAL' ? 'checked' : ''}/>잠정·예상 값으로 표시${term('잠정')}</label>` : ''}
      ${diff && canEdit() ? `<div class="flex items-center justify-between gap-2 rounded-lg border border-warning/60 bg-warning/10 px-3 py-2"><span>연동 값 ${fmtRaw(item, v.interfaceValue)}이(가) 입력한 값 ${fmtRaw(item, v.value)}과 다릅니다.</span><button type="button" class="btn btn-outline btn-sm" id="cmAdopt">연동 값으로 바꾸기</button></div>` : ''}
      ${locked && canEdit() ? `<fieldset class="space-y-2 rounded-lg border p-3"><legend class="px-1 text-xs font-medium">보정${term('보정')}</legend>
        <div class="grid gap-2 sm:grid-cols-[8rem_1fr]"><input id="cmOvVal" class="input h-8 text-end tabular-nums" placeholder="보정 값" value="${v?.source === 'OVERRIDE' ? fmtRaw(item, v.value) : ''}"/><input id="cmOvReason" class="input h-8" maxlength="200" placeholder="보정 사유 (필수)" value="${esc(v?.overrideReason ?? '')}"/></div>

function saveInputs() {

    if (v) (P.history[key] ||= []).push({ value: v.value, status: v.status, source: v.source, updatedAt: v.updatedAt, updatedBy: v.updatedBy });

function downloadTemplate() {
  const periods = inputPeriods(), used = usedItemKeys(P);
  const rows = [['itemKey', 'name', 'cycle', 'period', 'value']];
  P.items.filter(i => used.has(i.key) && i.cycle === state.cycle).forEach(i => periods.forEach(p => { if (!isLocked(i, state.cycle, p)) rows.push([i.key, i.name, state.cycle, p, P.values[valueKey(i.key, state.cycle, p)]?.value ?? '']); }));
  const blob = new Blob(['﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${H.code}_${state.cycle}_${periods[0]}_${periods[periods.length - 1]}.csv`; a.click();
}
function uploadFile(file) {
  file.text().then(text => {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(Boolean), rejected = [];
    let filled = 0;
    lines.slice(1).forEach((line, i) => {
      const [itemKey, , cycle, period, value] = line.split(',').map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"'));
      const item = itemOf(itemKey);
      if (!item) return rejected.push(`${i + 2}행: 모르는 항목 ${itemKey}`);
      if (item.cycle !== cycle) return rejected.push(`${i + 2}행: 주기 불일치`);
      if (isLocked(item, cycle, period)) return rejected.push(`${i + 2}행: 연동 항목`);
      if (value === '') return;
      if (!Number.isFinite(num(value))) return rejected.push(`${i + 2}행: 숫자 아님`);
      state.edits[valueKey(itemKey, cycle, period)] = value; filled++;
    });
    render();
    toast(`파일 값 ${filled}칸을 채웠습니다. 저장해야 반영됩니다.${rejected.length ? ` 읽지 못한 행 ${rejected.length}개` : ''}`);
  });
}

/* ---------- 데이터 항목 ---------- */
function itemTab() {
  const users = k => P.kpis.filter(x => [...kpiItemKeys(x), ...subItemKeys(x)].includes(k));
  const rows = P.items.map(i => {
    const us = users(i.key), last = Object.entries(P.values).filter(([key, v]) => key.startsWith(i.key + '|') && v.source === 'INTERFACE').map(([, v]) => v.updatedAt).sort().pop();
    return `<tr class="border-b last:border-0 ${us.some(x => x.enabled) ? '' : 'text-muted-foreground'}">
      <td class="td font-mono text-xs">${i.key}</td><td class="td font-medium">${esc(i.name)}${i.seed ? '' : ' <span class="badge badge-warning ms-1">추가</span>'}</td>
      <td class="td">${unitText(i)}</td><td class="td">${AGGREGATION[i.aggregation]}</td><td class="td">${CYCLE_LABEL[i.cycle]}</td>
      <td class="td"><span class="inline-flex items-center gap-1.5"><i data-lucide="${COLLECTION[i.collectionMethod].icon}" class="size-3.5"></i>${COLLECTION[i.collectionMethod].label}${i.interfaceFrom ? ` <span class="text-xs text-muted-foreground">${i.interfaceFrom}~</span>` : ''}</span></td>
      <td class="td text-xs">${esc(i.sourceSystem)}</td>
      <td class="td text-xs">${i.cycle === 'WEEK' ? `다음 주 ${'일월화수목금토'[i.deadline.weekday ?? 3]}요일` : `다음 ${i.cycle === 'QUARTER' ? '분기 첫 달' : '달'} ${i.deadline.dayOfMonth ?? 10}일`}</td>
      <td class="td max-w-[200px] truncate text-xs" title="${us.map(x => esc(x.name)).join(', ')}">${us.map(x => esc(x.name)).join(', ') || '-'}</td>
      <td class="td text-xs">${i.collectionMethod === 'INTERFACE' ? (last ? `<span class="inline-flex items-center gap-1 text-success"><i data-lucide="circle-check" class="size-3"></i>${last}</span>` : '<span class="text-muted-foreground">수신 전</span>') : '-'}</td>
      <td class="td text-end"><button type="button" class="btn btn-ghost btn-icon" data-item-edit="${i.key}" aria-label="${canEdit() ? '편집' : '보기'}"><i data-lucide="${canEdit() ? 'pencil' : 'eye'}"></i></button></td></tr>`;
  }).join('');
  return readOnlyNote() + card('데이터 항목', `병원에서 받는 원자료 ${P.items.length}개입니다. 흐린 행은 사용 중인 KPI가 쓰지 않는 항목입니다. 병원 IT 요청 목록은 docs/10-hospital-data-interface.md.`, `
    <div class="overflow-x-auto"><table class="w-full min-w-[1100px] text-sm"><thead><tr class="border-b"><th class="th">key</th><th class="th">이름</th><th class="th">단위</th><th class="th">집계</th><th class="th">수집 주기</th><th class="th">수집 방식</th><th class="th">출처</th><th class="th">입력 기한</th><th class="th">쓰는 KPI</th><th class="th">연동 상태</th><th class="th text-end">관리</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    canEdit() ? '<button type="button" class="btn btn-default btn-sm" id="addItem"><i data-lucide="plus"></i>데이터 항목 추가</button>' : '');
}
function itemModal(key) {
  const orig = key ? itemOf(key) : null, ro = !canEdit();
  const it = orig ? structuredClone(orig) : { key: '', name: '', unit: '건', aggregation: 'SUM', cycle: 'MONTH', collectionMethod: 'MANUAL', sourceSystem: '', referenceDateNote: '', denominatorItemKey: null, interfaceFrom: null, deadline: { dayOfMonth: 10 }, allowNegative: false, seed: false };
  const dsb = ro ? 'disabled' : '', lock = it.seed || ro ? 'disabled' : '';
  openModal({
    title: orig ? (ro ? '데이터 항목 보기' : '데이터 항목 편집') : '데이터 항목 추가', size: 'max-w-2xl', desc: it.seed ? '기본 항목은 key·단위·집계 방식을 바꿀 수 없습니다.' : '',
    body: `<form class="space-y-4" onsubmit="return false">
      <div class="grid gap-4 sm:grid-cols-3">
        <label class="block space-y-1.5"><span class="label">key <span class="text-destructive">*</span></span><input id="imKey" class="input font-mono text-xs" value="${esc(it.key)}" placeholder="SURGERY_CASES" ${orig ? 'disabled' : ''}/></label>
        <label class="block space-y-1.5 sm:col-span-2"><span class="label">이름 <span class="text-destructive">*</span></span><input id="imName" class="input" maxlength="30" value="${esc(it.name)}" ${dsb}/></label>
        <label class="block space-y-1.5"><span class="label">단위</span><input id="imUnit" class="input" value="${esc(it.unit)}" placeholder="건 / 명 / AMOUNT" ${lock}/></label>
        <label class="block space-y-1.5"><span class="label">집계</span><select id="imAgg" class="select" ${lock}>${Object.entries(AGGREGATION).map(([a, b]) => `<option value="${a}" ${a === it.aggregation ? 'selected' : ''}>${b}</option>`).join('')}</select></label>
        <label class="block space-y-1.5"><span class="label">수집 주기</span><select id="imCycle" class="select" ${dsb}>${['WEEK', 'MONTH', 'QUARTER'].map(c => `<option value="${c}" ${c === it.cycle ? 'selected' : ''}>${CYCLE_LABEL[c]}</option>`).join('')}</select></label>
      </div>
      <fieldset class="space-y-2"><legend class="label">수집 방식</legend><div class="grid gap-2 sm:grid-cols-3">${Object.entries(COLLECTION).map(([v, c]) => `<label class="flex cursor-pointer items-center gap-2 rounded-lg border p-3 text-sm has-[:checked]:border-primary has-[:checked]:bg-accent/60"><input type="radio" name="imMethod" value="${v}" class="size-4" ${it.collectionMethod === v ? 'checked' : ''} ${dsb}/><i data-lucide="${c.icon}" class="size-4"></i>${c.label}</label>`).join('')}</div>
        <div id="imIfaceWrap" class="${it.collectionMethod === 'INTERFACE' ? '' : 'hidden'} space-y-1"><label class="flex items-center gap-2 text-sm">연동 시작 기간 <input id="imIfaceFrom" class="input h-8 w-36 font-mono text-xs" value="${esc(it.interfaceFrom ?? '')}" placeholder="${it.cycle === 'WEEK' ? '2026-W45' : '202611'}" ${dsb}/></label>
          <p class="text-xs text-muted-foreground">이 기간부터 칸이 잠기고 연동 값을 씁니다. 그 전 기간은 입력한 값을 그대로 쓰고, 연동 값이 들어오면 "연동 값 차이"로 보여 줍니다(D25).</p></div></fieldset>
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block space-y-1.5"><span class="label">출처 시스템</span><input id="imSrc" class="input" value="${esc(it.sourceSystem)}" placeholder="HIS, 원무·회계" ${dsb}/></label>
        <label class="block space-y-1.5"><span class="label">기준 날짜</span><input id="imRef" class="input" value="${esc(it.referenceDateNote)}" placeholder="퇴원일, 청구월, 월말" ${dsb}/></label>
        <label class="block space-y-1.5"><span class="label">입력 기한</span><span class="flex items-center gap-2 text-sm" id="imDeadline"></span></label>
        <label class="block space-y-1.5"><span class="label">분모 항목 <span class="text-xs font-normal text-muted-foreground">분자 ≤ 분모 검증</span></span><select id="imDen" class="select" ${dsb}><option value="">없음</option>${P.items.filter(i => i.key !== it.key).map(i => `<option value="${i.key}" ${it.denominatorItemKey === i.key ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</select></label>
      </div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="imNeg" class="size-4" ${it.allowNegative ? 'checked' : ''} ${dsb}/>음수 허용 (조정액·페널티)</label>
      <p id="imErr" class="text-sm text-destructive"></p>
    </form>`,
    footer: ro ? '<button type="button" class="btn btn-outline" data-close>닫기</button>' : '<button type="button" class="btn btn-outline" data-close>취소</button><button type="button" class="btn btn-default" id="imSave">저장</button>',
    onMount: (el, close) => {
      const q = s => el.querySelector(s);
      const drawDeadline = () => {
        const c = q('#imCycle').value;
        q('#imDeadline').innerHTML = c === 'WEEK' ? `다음 주 <select id="imDl" class="select h-8 w-24" ${dsb}>${[1, 2, 3, 4, 5].map(d => `<option value="${d}" ${(it.deadline.weekday ?? 3) === d ? 'selected' : ''}>${'일월화수목금토'[d]}요일</option>`).join('')}</select>` : `다음 ${c === 'QUARTER' ? '분기 첫 달' : '달'} <input id="imDl" class="input h-8 w-16 text-end" value="${it.deadline.dayOfMonth ?? 10}" ${dsb}/>일`;
      };
      drawDeadline();
      el.addEventListener('change', e => { if (e.target.id === 'imCycle') drawDeadline(); q('#imIfaceWrap').classList.toggle('hidden', q('input[name="imMethod"]:checked').value !== 'INTERFACE'); });
      q('#imSave')?.addEventListener('click', () => {
        const d = { ...it, key: (q('#imKey').value || '').trim().toUpperCase(), name: q('#imName').value.trim(), unit: q('#imUnit').value.trim() || it.unit, aggregation: q('#imAgg').value, cycle: q('#imCycle').value,
          collectionMethod: q('input[name="imMethod"]:checked').value, sourceSystem: q('#imSrc').value.trim(), referenceDateNote: q('#imRef').value.trim(), denominatorItemKey: q('#imDen').value || null, allowNegative: q('#imNeg').checked,
          deadline: q('#imCycle').value === 'WEEK' ? { weekday: +q('#imDl').value } : { dayOfMonth: +q('#imDl').value || 10 } };
        d.interfaceFrom = d.collectionMethod === 'INTERFACE' ? (q('#imIfaceFrom').value.trim() || (d.cycle === 'WEEK' ? nextWeek(isoWeekKey(new Date(Date.parse(MOCK_TODAY)))) : mKey(mIndex(LATEST_MONTH) + 1))) : null;
        let err = '';
        if (!/^[A-Z][A-Z0-9_]*$/.test(d.key)) err = 'key는 영문 대문자·숫자·밑줄로 씁니다.';
        else if (!orig && itemOf(d.key)) err = '같은 key가 있습니다.';
        else if (!d.name) err = '이름을 입력하세요.';
        else if (d.interfaceFrom && !(d.cycle === 'WEEK' ? /^\d{4}-W\d{2}$/ : d.cycle === 'QUARTER' ? /^\d{4}Q[1-4]$/ : /^\d{6}$/).test(d.interfaceFrom)) err = '연동 시작 기간 형식을 확인하세요.';
        else { const users = P.kpis.filter(x => formulaItemKeys(x).includes(d.key) && CYCLE_ORDER[x.cycle] < CYCLE_ORDER[d.cycle]); if (users.length) err = `${users.map(x => x.name).join(', ')} KPI의 측정 주기보다 수집 주기가 깁니다.`; }
        if (err) { q('#imErr').textContent = err; return; }
        if (orig) Object.assign(orig, d); else P.items.push(d);
        persist(); close(); render(); toast('저장했습니다.');
      });
    },
  });
}

/* ---------- 그리기·이벤트 ---------- */
const TAB_RENDER = { input: inputTab, kpis: kpiTab, targets: targetTab, items: itemTab };
function render() {
  const sy = window.scrollY;
  page.innerHTML = `<div class="space-y-4">${renderTop()}<div class="space-y-6">${TAB_RENDER[state.tab]()}</div></div>`;
  lucide.createIcons();
  window.scrollTo(0, sy);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-incycle],[data-shift],[data-cell],#inputSave,#inputReset,#downloadTpl,[data-kpi-toggle],[data-kpi-move],[data-kpi-edit],[data-kpi-delete],#addKpi,[data-target-edit],[data-target-history],[data-item-edit],#addItem');
  if (!t) return;
  const leave = fn => { if (Object.keys(state.edits).length && (t.dataset.tab || t.dataset.incycle || t.dataset.shift)) confirmModal('저장하지 않은 변경 내용이 있습니다. 이동할까요?', () => { state.edits = {}; fn(); render(); }); else { fn(); render(); } };
  if (t.dataset.tab) leave(() => { state.tab = t.dataset.tab; history.replaceState(null, '', '#' + state.tab); });
  else if (t.dataset.incycle) leave(() => { state.cycle = t.dataset.incycle; });
  else if (t.dataset.shift) leave(() => shiftEnd(+t.dataset.shift));
  else if (t.dataset.cell) cellModal(t.dataset.cell);
  else if (t.id === 'inputSave') saveInputs();
  else if (t.id === 'inputReset') { state.edits = {}; render(); }
  else if (t.id === 'downloadTpl') downloadTemplate();
  else if (t.dataset.kpiToggle && canEdit()) { const k = kpiOf(t.dataset.kpiToggle); k.enabled = !k.enabled; persist(); render(); toast(k.enabled ? `${k.name}을(를) 켰습니다.` : `${k.name}을(를) 껐습니다. 데이터는 남습니다.`); }
  else if (t.dataset.kpiMove) { const [i, d] = t.dataset.kpiMove.split(':').map(Number); [P.kpis[i], P.kpis[i + d]] = [P.kpis[i + d], P.kpis[i]]; persist(); render(); }
  else if (t.dataset.kpiEdit) kpiModal(t.dataset.kpiEdit);
  else if (t.dataset.kpiDelete) { const k = kpiOf(t.dataset.kpiDelete); confirmModal(`"${esc(k.name)}" KPI를 삭제합니다. 데이터 항목과 입력한 값은 남습니다.`, () => { P.kpis = P.kpis.filter(x => x !== k); delete P.targets[k.key]; persist(); render(); toast('삭제했습니다.'); }, { okLabel: '삭제', destructive: true, title: 'KPI 삭제' }); }
  else if (t.id === 'addKpi') addKpiModal();
  else if (t.dataset.targetEdit) targetModal(t.dataset.targetEdit);
  else if (t.dataset.targetHistory) targetHistoryModal(t.dataset.targetHistory);
  else if (t.dataset.itemEdit) itemModal(t.dataset.itemEdit);
  else if (t.id === 'addItem') itemModal(null);
});
/* 입력 칸 — 다시 그리면 포커스를 잃으므로 칸 테두리와 저장 막대만 바꾸고, 칸을 떠날 때 다시 그린다 */
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  const v = P.values[k], [ik, cycle] = k.split('|'), item = itemOf(ik);
  if (fmtRaw(item, v?.value) === e.target.value || (!v && e.target.value === '')) delete state.edits[k]; else state.edits[k] = e.target.value;
  updateInputStatus();
});
document.addEventListener('keydown', e => {
  const k = e.target.dataset?.input; if (!k || e.key !== 'Enter') return;
  e.preventDefault();
  const inputs = [...document.querySelectorAll('[data-input]')], cols = document.querySelector('thead tr').children.length - 1, i = inputs.indexOf(e.target);
  const row = e.target.closest('tr'), cellIdx = [...row.children].indexOf(e.target.closest('td'));
  const rows = [...document.querySelectorAll('tbody tr')], ri = rows.indexOf(row);
  for (let r = ri + (e.shiftKey ? -1 : 1); r >= 0 && r < rows.length; r += e.shiftKey ? -1 : 1) { const tgt = rows[r].children[cellIdx]?.querySelector('[data-input]'); if (tgt) { tgt.focus(); tgt.select(); return; } }
});
/* 엑셀에서 복사한 범위 붙여넣기 — 칸을 기준으로 오른쪽·아래로 채운다 */
document.addEventListener('paste', e => {
  const k = e.target.dataset?.input; if (!k) return;
  const text = e.clipboardData.getData('text'); if (!/[\t\n]/.test(text)) return;
  e.preventDefault();
  const rows = [...document.querySelectorAll('tbody tr')], row = e.target.closest('tr'), ri = rows.indexOf(row), ci = [...row.children].indexOf(e.target.closest('td'));
  text.trim().split(/\r?\n/).forEach((line, dr) => line.split('\t').forEach((val, dc) => { const inp = rows[ri + dr]?.children[ci + dc]?.querySelector('[data-input]'); if (inp) state.edits[inp.dataset.input] = val.trim(); }));
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'roleSelect') { state.role = e.target.value; render(); toast(state.role === 'CUSTOMER_DEVELOPER' ? '고객 개발자 — 데이터 입력만 할 수 있습니다.' : '고객 관리자 — 모든 설정을 편집할 수 있습니다.'); }
  if (e.target.id === 'uploadFile' && e.target.files[0]) uploadFile(e.target.files[0]);
});

render();
</script>
</body>
</html>
